[project]
name = "nonparametric-charts"
version = "0.1.0"
description = "Nonparametric (distribution-free) Shewhart control charts for univariate process monitoring"
authors = [
    {name = "Nebolsin Vasili", email = "nebolsinvasili@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]

# Алиасы запуска: `npc test`, `npc examples`, `npc experiment` (см. cli.py).
[project.scripts]
npc = "nonparametric_charts.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Пакет лежит в src-layout; сборка идёт через poetry-core, поэтому установка
# работает и командой `poetry install`, и `pip install .` (PEP 517).
packages = [{ include = "nonparametric_charts", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest-sugar (>=1.1.1,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Красивый вывод в терминале: pytest-sugar (прогресс-бар, галочки),
# краткая сводка по пропущенным/упавшим и 10 самых медленных тестов.
addopts = "-ra --durations=10"
markers = [
    # Производительность/долгие проверки: пропускаются командой
    # `npc test --fast`, запускаются только `npc test --slow`.
    "slow: долгие проверки, не нужные в локальном быстром цикле",
]